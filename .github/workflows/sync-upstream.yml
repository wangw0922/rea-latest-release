name: Force mirror from upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-source-mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full Git history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror upstream source while retaining local GitHub workflows
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The default GITHUB_TOKEN cannot update other workflow files.
          # Keep all local workflow definitions, including this scheduled mirror.
          cp -a .github/workflows "$RUNNER_TEMP/retained-workflows"

          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main

          # Replace tracked source files with the exact upstream tree,
          # including upstream additions and deletions, without rewriting history.
          git read-tree --reset -u refs/remotes/upstream/main

          mkdir -p .github
          rm -rf .github/workflows
          cp -a "$RUNNER_TEMP/retained-workflows" .github/workflows

          git add -A
          if git diff --cached --quiet; then
            echo "Source already matches upstream (excluding preserved workflows)."
            exit 0
          fi

          git commit -m "chore: mirror upstream code and preserve GitHub workflows"
          git push origin HEAD:refs/heads/main
